<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">3.3.18</span><span class="period heading-divison-mark heading-divison-mark__period">.</span>

<div class="para logical">
<div class="para">The constant <span class="process-math">\(e\)</span> is the real number that satisfies the limit</div>
<div class="displaymath process-math">
\begin{equation*}
\lim_{h\to h}\frac{e^h-1}{h}=1
\end{equation*}
</div>
<div class="para">Further,</div>
<div class="displaymath process-math">
\begin{equation*}
\frac{d}{dx}(e^x)=e^x
\end{equation*}
</div>
